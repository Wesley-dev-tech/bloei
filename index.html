    <title>Bloei</title>
    <script>
      // Zet het thema vóór de eerste verf, zodat het niet flitst. De keuze (poeder, salie, nacht of auto)
      // wordt door thema.js gespiegeld naar localStorage onder 'bloei-thema' (in de demo onder 'bloei-demo-thema').
      // Eén script voor beide versies, want de CSP-hash geldt voor beide: het leest eerst de sleutel van de echte app en dan die van de demo.
      (function () {
        try {
          var keuze = localStorage.getItem('bloei-thema') || localStorage.getItem('bloei-demo-thema') || 'poeder';
          if (keuze === 'auto') {
            keuze = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'nacht' : 'poeder';
          }
          if (keuze === 'salie' || keuze === 'nacht') {
            document.documentElement.setAttribute('data-theme', keuze);
          }
          // theme-color per thema, op één plek. Een meta-tag kent geen CSS-variabelen, dus staan de waarden hier
          // als hex: ze zijn de --c-bg van het thema in bloei-huisstijl/tokens.css (HUISSTIJL §9).
          // thema.js zet dezelfde kleur bij een themawissel (uit de computed --c-bg).
          var kleuren = { poeder: '#FBF7F4', salie: '#F7F8F4', nacht: '#1F1720' };
          document.querySelector('meta[name="theme-color"]').setAttribute('content', kleuren[keuze] || kleuren.poeder);
        } catch (fout) {
          /* localStorage niet beschikbaar: Poeder blijft staan */
        }
      })();
    </script>
